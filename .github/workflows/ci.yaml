name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Official UV Setup
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      # 2. Sync dependencies from uv.lock
      - name: Install dependencies
        run: uv sync --frozen

      # 3. Run Checks inside the uv environment
      - name: Run Ruff
        run: uv run ruff check app/

      - name: Run MyPy
        run: uv run mypy app/

      - name: Run Pytest
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ai-research-agent .
