services:
  backend:
    build: .
    container_name: agent_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.api.routes:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}

  frontend:
    build: .
    container_name: agent_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/static/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
